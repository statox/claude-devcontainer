services:
  agent:
    build:
      context: ./agent
      args:
        USER_UID: "${DEV_UID}"
        USER_GID: "${DEV_GID}"
    # Fixed image name: all workspaces share one image
    image: claude-devcontainer-agent
    # Keeps the container running for `ccc` to exec into
    command: ["sleep", "infinity"]
    network_mode: host
    working_dir: /workdir
    volumes:
      - "${WORKSPACE_FOLDER}:/workdir"
      - claude-home:/home/dev/.claude
      - glab-config:/home/dev/.config/glab-cli
      - mise-state:/home/dev/.local/state/mise
      - mise-root-state:/root/.local/state/mise
      - claude-desktop-notification-sock:/run/claude-desktop-notification
      - mcp-context7-sock:/run/mcp-context7
      - mcp-thiri-sock:/run/mcp-thiri
      - "${CLAUDE_DEVCONTAINER_HOME}:/home/dev/.claude-devcontainer"
      - "${HOME}/.claude.json:/home/dev/.claude.json"
      - "${HOME}/.netrc:/home/dev/.netrc"

volumes:
  # Claude session state
  claude-home:
    name: claude-home
  # gitlab cli authentication
  glab-config:
    name: glab-config
  # dev mise state, including trust decisions.
  # Unnamed: each repo gets its own.
  mise-state:
  # root mise state, including trust decisions.
  # Unnamed: each repo gets its own.
  mise-root-state:
  # Socket for the notification container
  claude-desktop-notification-sock:
    name: claude-desktop-notification-sock
  # Socket for the context7 container
  mcp-context7-sock:
    name: mcp-context7-sock
  # Socket for the thiri container
  mcp-thiri-sock:
    name: mcp-thiri-sock
